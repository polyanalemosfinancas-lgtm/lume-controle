<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Família · Controle Financeiro</title>
<meta name="theme-color" content="#00122d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Família">
<link rel="manifest" href="casa-manifest.json">
<link rel="apple-touch-icon" href="casa-apple-icon.png">
<link rel="icon" type="image/png" href="casa-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1c2420;--mut:#6c7470;--line:#e6e2d8;--pri:#0f2a55;--pri2:#e6ecf6;--gold:#c9a84c;--navy:#00122d;--warn:#b77a0c;--warn2:#fbf0d9;--bad:#c2412d;--bad2:#fbe4df;--ok:#2b8549;--ok2:#e0f2e5;--blue:#3b6fb6;--blue2:#e4edf8;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.35}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:2px solid var(--gold)}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;border-radius:50%;flex:none}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand b{display:block;font-weight:800;font-size:18px;color:var(--gold);letter-spacing:.2px;font-family:Georgia,serif}
.brand small{display:block;font-weight:600;font-size:10.5px;color:#dfe5ef;letter-spacing:1.5px}
.mnav{color:var(--ink)}
.mnav{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.mnav button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.mnav button:active{background:var(--pri2)}
.mnav span{font-weight:700;font-size:14px;min-width:78px;text-align:center}
#status{display:none;margin-top:8px;font-size:13px;padding:8px 10px;border-radius:10px}
#status.on{display:block}
#status.warn{background:var(--warn2);color:var(--warn)}
#status.bad{background:var(--bad2);color:var(--bad)}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
section.tab{display:none}
section.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.lbl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px}
h3{margin:0 0 10px;font-size:16px}
.valor-wrap{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:4px 2px 6px}
.valor-wrap:focus-within{border-color:var(--pri)}
.valor-wrap span{font-size:22px;font-weight:700;color:var(--mut)}
.valor-wrap input{border:0;outline:0;background:none;font-size:38px;font-weight:800;width:100%;letter-spacing:-1px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.terc.on{background:var(--blue);border-color:var(--blue)}
.chip.sm{padding:5px 11px;font-size:13px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 4px 7px;text-align:center;cursor:pointer;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cat b{font-size:22px;line-height:1}
.cat i{font-style:normal;font-size:11px;font-weight:600;line-height:1.15;color:var(--ink)}
.cat.on{border-color:var(--pri);background:var(--pri2);box-shadow:inset 0 0 0 1px var(--pri)}
.seg{display:flex;background:#ece8df;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:18px;font-weight:700;cursor:pointer}
.stepper span{min-width:34px;text-align:center;font-weight:800;font-size:17px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:15px;outline:0}
.inp:focus{border-color:var(--pri)}
.hint{font-size:13px;color:var(--mut);margin-top:8px}
.hint b{color:var(--ink)}
.box{background:var(--blue2);border-radius:12px;padding:10px 12px;margin-top:10px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--pri);color:#fff;font-weight:800;font-size:16px;padding:15px;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--bad2);color:var(--bad)}
.btn.sm{padding:11px;font-size:14px}
.btns{display:flex;gap:8px;margin-top:14px}
.btns .btn{flex:1}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.ico{width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.it{flex:1;min-width:0}
.it b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{color:var(--mut);font-size:12.5px}
.iv{font-weight:700;white-space:nowrap;text-align:right}
.iv small{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
.daygrp{font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 2px;text-transform:capitalize}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--bg);border-radius:12px;padding:10px}
.kpi small{display:block;font-size:12px;color:var(--mut);font-weight:600}
.kpi b{font-size:17px}
.bar{height:9px;background:#ece8df;border-radius:99px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;border-radius:99px;background:var(--pri);transition:width .3s}
.bar.warn>div{background:var(--warn)}.bar.bad>div{background:var(--bad)}.bar.mut>div{background:#9aa7a1}
.brow{padding:9px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.brow .top b{font-weight:600}
.brow .sub{font-size:12px;color:var(--mut);margin-top:3px}
.sub.bad{color:var(--bad);font-weight:600}.sub.warn{color:var(--warn);font-weight:600}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.check{width:30px;height:30px;border-radius:50%;border:2px solid #c9c3b6;background:var(--card);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px}
.check.on{background:var(--ok);border-color:var(--ok)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:4px;vertical-align:1px}
.tag.ok{background:var(--ok2);color:var(--ok)}.tag.bad{background:var(--bad2);color:var(--bad)}.tag.warn{background:var(--warn2);color:var(--warn)}.tag.mut{background:var(--bg);color:var(--mut)}.tag.blue{background:var(--blue2);color:var(--blue)}
.edit{border:0;background:none;font-size:17px;padding:6px;cursor:pointer;color:var(--mut)}
.done .it b{color:var(--mut);text-decoration:line-through}
.fl{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px}
.fl span:first-child{color:var(--mut)}
.fl.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-weight:800}
.fl.sub2{font-size:12.5px;padding:2px 0 2px 14px}
.mhead{display:flex;justify-content:space-between;align-items:baseline}
.mhead b{font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:6px 1px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mut)}
nav button span{font-size:20px;line-height:1.1}
nav button.on{color:var(--pri);background:var(--pri2)}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(20,25,22,.45)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:5px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:18px 8px;font-size:14px}
.catrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.catrow .nm{flex:1;min-width:0;font-weight:600;font-size:14px}
.catrow .nm small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.catrow input{width:110px;text-align:right;padding:8px 10px}
.x{border:0;background:var(--bg);width:30px;height:30px;border-radius:8px;cursor:pointer;color:var(--mut);font-weight:700}
textarea.inp{min-height:120px;font-size:12px;font-family:ui-monospace,monospace}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.fx{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.fx th,table.fx td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.fx th{font-size:12px;color:var(--mut);background:#faf8f3;position:sticky;top:0}
table.fx th small{font-weight:500;font-size:10px}
table.fx th:first-child,table.fx td:first-child{position:sticky;left:0;z-index:1;text-align:left;background:var(--card);max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:1px 0 0 var(--line)}
table.fx th:first-child{background:#faf8f3;z-index:2}
table.fx td.cur,table.fx th.cur{background:#f3f8f5}
table.fx td.pv{color:var(--mut);font-style:italic}
table.fx tr.sec td{background:var(--bg)!important;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--mut);text-align:left}
table.fx tr.tt td{font-weight:800}
table.fx td.pos{color:var(--ok)}table.fx td.neg{color:var(--bad)}
 #login{position:fixed;inset:0;z-index:80;background:var(--navy);display:none;align-items:center;justify-content:center;padding:24px}
#login.on{display:flex}
#login .lg{width:100%;max-width:360px;text-align:center;color:#fff}
#login img{width:150px;height:150px;border-radius:50%;margin-bottom:18px}
#login .inp{margin-bottom:10px}
#login .btn{background:var(--gold);color:var(--navy)}
#login .err{color:#ffb4a6;font-size:13px;min-height:18px;margin:4px 0 8px}
#login a{color:#dfe5ef;font-size:13px;display:inline-block;margin-top:14px;cursor:pointer;text-decoration:underline}
@media (min-width:480px){.cats{grid-template-columns:repeat(5,1fr)}}
</style>
</head>

function dueDate(card,m){const [y,mm]=m.split('-').map(Number);return ymd(new Date(y,mm-1,Math.min(card.vence,dim(y,mm))))}
function closeDate(card,m){
  const [y,mm]=m.split('-').map(Number);
  if(+card.antes>0){const d=new Date(y,mm-1,Math.min(card.vence,dim(y,mm)));d.setDate(d.getDate()-card.antes);return ymd(d)}
  const cm=+card.fecha<+card.vence?m:addMes(m,-1);const [cy,cmm]=cm.split('-').map(Number);
  return ymd(new Date(cy,cmm-1,Math.min(card.fecha||1,dim(cy,cmm))));
}
// mês de vencimento da fatura em que a compra cai (compra no dia do fechamento ou depois → próxima fatura)
function faturaDe(card,data){const m0=data.slice(0,7);for(let k=0;k<3;k++){const m=addMes(m0,k);if(data<closeDate(card,m))return m}return addMes(m0,3)}
function mesRefDe(data,forma,cartaoId){const c=forma==='cartao'?cardOf(cartaoId):null;return c?faturaDe(c,data):data.slice(0,7)}
const ckOf=(m,k)=>(checksAll[m]||{})[k]||null;
const isPago=(m,k)=>!!(ckOf(m,k)&&ckOf(m,k).pago);
const ativo=(x,m)=>(!x.inicio||x.inicio<=m)&&(!x.fim||m<x.fim);
const mDiff=(a,b)=>{const [ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return (by-ay)*12+(bm-am)};
const fixaAtiva=(f,m)=>ativo(f,m)&&(!(+f.cada>1)||((mDiff(f.inicio||m,m)%+f.cada)+ +f.cada)%+f.cada===0);
const fixasDoMes=(m=mes)=>fixas.filter(f=>fixaAtiva(f,m)).sort((a,b)=>(a.dia||0)-(b.dia||0)||String(a.nome).localeCompare(b.nome));
// valor padrão do mês (considera reajustes programados "a partir de")
function valorBase(f,m=mes){let v=+f.valor||0;(Array.isArray(f.hist)?[...f.hist]:[]).sort((a,b)=>a.de.localeCompare(b.de)).forEach(h=>{if(h.de<=m)v=+h.valor||0});return v}
// valor do mês: ajuste/pagamento do mês, senão o padrão
const valorFixa=(f,m=mes)=>{const c=ckOf(m,f.id);return c&&c.valor!=null?+c.valor:valorBase(f,m)};
const CADA={1:'Todo mês',2:'A cada 2 meses',3:'A cada 3 meses',6:'A cada 6 meses',12:'Uma vez por ano'};
const lancsMes=(m=mes)=>lancsAll.filter(l=>l.mesRef===m);
function faturaCalc(card,m=mes){
  const ls=lancsAll.filter(l=>l.forma==='cartao'&&l.cartao===card.id&&l.mesRef===m);
  const fx=fixasDoMes(m).filter(f=>f.forma==='cartao'&&f.cartao===card.id);
  return{ls,fx,total:r2(sum(ls,l=>l.valor)+sum(fx,f=>valorBase(f,m)))};
}
function faturaValor(card,m=mes){const c=ckOf(m,'card_'+card.id);return c&&c.valor!=null?+c.valor:faturaCalc(card,m).total}
const entradasDoMes=(m=mes)=>entradas.filter(e=>e.tipo==='fixa'?ativo(e,m):e.mesRef===m).sort((a,b)=>(a.dia||+String(a.data||'').slice(8,10)||0)-(b.dia||+String(b.data||'').slice(8,10)||0));
const diaEntrada=e=>e.tipo==='fixa'?e.dia:+String(e.data||'').slice(8,10);
const valorEntrada=(e,m=mes)=>{const k='in_'+e.id;return isPago(m,k)&&ckOf(m,k).valor!=null?+ckOf(m,k).valor:+e.valor||0};
function mergeCfg(d){
  const c=JSON.parse(JSON.stringify(DEF_CFG));
  if(Array.isArray(d.pessoas)&&d.pessoas.length)c.pessoas=d.pessoas.map(String).filter(p=>p!==TERC);
  if(Array.isArray(d.cats)&&d.cats.length)c.cats=d.cats.filter(x=>x&&x.id).map(x=>({id:String(x.id),emoji:String(x.emoji||'🔖'),nome:String(x.nome||x.id)}));
  if(Array.isArray(d.cartoes))c.cartoes=d.cartoes.filter(x=>x&&x.id).map(x=>({id:String(x.id),nome:String(x.nome||'Cartão'),fecha:+x.fecha||0,vence:Math.min(31,Math.max(1,+x.vence||1)),antes:+x.antes||0}));
  if(d.metas&&typeof d.metas==='object')c.metas={...d.metas};
  c.metaCartao=+d.metaCartao||0;c.saldoConta=d.saldoConta==null?null:+d.saldoConta;c.saldoData=String(d.saldoData||'');
  return c;
}

  const hm=hojeMes(),dh=new Date().getDate();

async function salvarLanc(){
  if(!form.cents){toast('Digite o valor',true);$('#fValor').focus();return}
  if(form.quem===TERC&&!form.terceiro.trim()){toast('Digite o nome de quem usou',true);$('#fTerc').focus();return}
  if(!form.cat){toast('Escolha a categoria',true);return}
  if(form.forma==='cartao'&&!cardOf(form.cartao)){toast('Escolha o cartão',true);return}
  if(!db){toast('Sem conexão com os dados',true);return}
  const b=$('#fSalvar');b.disabled=true;b.textContent='Salvando…';
  const N=form.forma==='cartao'?form.parc:1,base=mesRefDe(form.data,form.forma,form.cartao),grupo=N>1?'g'+uid():null;
  const per=Math.floor(form.cents/N),resto=form.cents-per*N;
  const terc=form.quem===TERC?form.terceiro.trim():null;
  try{
    for(let i=0;i<N;i++){
      await db.collection('lanc').add({valor:(per+(i===0?resto:0))/100,quem:form.quem,terceiro:terc,reemb:false,cat:form.cat,forma:form.forma,cartao:form.forma==='cartao'?form.cartao:null,data:form.data,desc:form.desc.trim(),mesRef:addMes(base,i),parc:i+1,parcN:N,grupo,total:form.cents/100,criadoEm:Date.now()});
    }
    toast(`✓ ${brl(form.cents/100)} lançado${N>1?` em ${N}x`:''}`);
    if(form.quem!==TERC)store.set('quem',form.quem);store.set('forma',form.forma);if(form.cartao)store.set('cartao',form.cartao);
    form.cents=0;form.desc='';form.parc=1;form.cat=null;form.data=hoje();if(form.quem===TERC){form.quem=store.get('quem')||cfg.pessoas[0];form.terceiro=''}
    renderLancar();try{window.scrollTo(0,0)}catch(e){}
  }catch(e){toast(errMsg(e),true);b.disabled=false;b.textContent='Salvar lançamento'}
}

}

function renderResumo(){
  const el=$('#tab-resumo');
  const L=lancsResumo(),casa=L.filter(l=>!isTerc(l)),terc=L.filter(isTerc);
  const fx=fixasDoMes();
  const dia=sum(casa,l=>l.valor);
  const fxTot=sum(fx,f=>valorFixa(f));
  const renda=sum(entradasDoMes(),e=>valorEntrada(e));
  const total=dia+fxTot,sobra=renda-total;
  let h=`<div class="seg" style="margin-bottom:12px"><button class="${resumoModo==='compra'?'on':''}" data-act="modo" data-v="compra">Pela data da compra</button><button class="${resumoModo==='pagamento'?'on':''}" data-act="modo" data-v="pagamento">Pelo mês que paga</button></div>`;
  h+=`<div class="card"><p class="lbl">${mesLabel(mes,true)}</p>`;
  if(renda>0){
    h+=`<div class="big ${sobra>=0?'pos':'neg'}">${brl(sobra)}</div><div class="hint" style="margin-top:2px">${sobra>=0?'sobra prevista no mês':'acima das entradas do mês'}</div>
    <div class="kpis" style="margin-top:12px"><div class="kpi"><small>Entradas</small><b>${brl(renda)}</b></div><div class="kpi"><small>Gasto da casa</small><b>${brl(total)}</b></div><div class="kpi"><small>Contas fixas</small><b>${brl(fxTot)}</b></div><div class="kpi"><small>Dia a dia</small><b>${brl(dia)}</b></div></div>`;
  }else h+=`<div class="big">${brl(total)}</div><div class="hint" style="margin-top:2px">gasto da casa (fixas ${brl(fxTot)} + dia a dia ${brl(dia)})</div><div class="hint">Cadastre as entradas (salários, pró-labore) na aba <b>Fluxo</b> para ver quanto sobra.</div>`;

function aPagar(m=mes){
  const it=[];
  fixasDoMes(m).filter(f=>f.forma!=='cartao').forEach(f=>it.push({tipo:'fixa',key:f.id,f,nome:f.nome,emoji:catOf(f.cat).emoji,dia:f.dia||1,valor:valorFixa(f,m),sub:[esc(f.quem||'Família'),f.forma==='debito'?'débito auto':'',+f.cada>1?CADA[f.cada].toLowerCase():''].filter(Boolean).join(' · ')}));
  cfg.cartoes.forEach(c=>{const fc=faturaCalc(c,m);it.push({tipo:'card',key:'card_'+c.id,c,nome:'Fatura '+c.nome,emoji:'💳',dia:+dueDate(c,m).slice(8,10),valor:faturaValor(c,m),sub:`${fc.ls.length} lançamento(s)${fc.fx.length?` + ${fc.fx.length} fixa(s)`:''} · fecha ${dd(closeDate(c,m))}`})});
  return it.sort((a,b)=>a.dia-b.dia||a.nome.localeCompare(b.nome));
}

// ================= FLUXO DE CAIXA =================
// ---- regime de caixa: realizado (pago/recebido, no mês da data do pagamento) + previsto (o que falta) ----
let fluxoModo=store.get('fluxo')||'tudo';
const ROW_TERC='__terc',ROW_REEMB='__reemb';
function splitFatura(card,m,v,cb){
  if(!card){cb('outros',v);return}
  const fc=faturaCalc(card,m);let s=0;
  fc.ls.forEach(l=>{cb(isTerc(l)?ROW_TERC:l.cat,+l.valor);s+=+l.valor});
  fc.fx.forEach(f=>{const vv=valorBase(f,m);cb(f.cat,vv);s+=vv});
  const res=r2(v-s);if(Math.abs(res)>=0.01)cb('outros',res); // fatura sem detalhe → Outros
}
function caixa(){
  const hm=hojeMes(),M={};
  const add=(m,g,row,v,prev)=>{v=+v||0;if(!v)return;const o=(M[m]=M[m]||{ent:{},sai:{}})[g];const c=o[row]=o[row]||{r:0,p:0};c[prev?'p':'r']+=v};
  for(const [cm,ck] of Object.entries(checksAll)){
    for(const [k,c] of Object.entries(ck||{})){
      if(!c||!c.pago)continue;
      const m=String(c.em||cm).slice(0,7);
      if(k.startsWith('in_')){const e=entradas.find(x=>x.id===k.slice(3));add(m,'ent',e?e.nome:'Outras entradas',c.valor!=null?c.valor:(e?e.valor:0))}
      else if(k.startsWith('card_')){const card=cardOf(k.slice(5));const v=c.valor!=null?+c.valor:(card?faturaCalc(card,cm).total:0);splitFatura(card,cm,v,(row,val)=>add(m,'sai',row,val))}
      else{const f=fixas.find(x=>x.id===k);add(m,'sai',f?f.cat:'outros',c.valor!=null?c.valor:(f?valorBase(f,cm):0))}
    }
  }
  lancsAll.forEach(l=>{if(l.forma!=='cartao')add(String(l.data).slice(0,7),'sai',isTerc(l)?ROW_TERC:l.cat,l.valor);if(isTerc(l)&&l.reemb)add(String(l.reembEm||l.data).slice(0,7),'ent',ROW_REEMB,l.valor)});
  for(let i=0;i<=11;i++){const m=addMes(hm,i);
    fixasDoMes(m).filter(f=>f.forma!=='cartao'&&!isPago(m,f.id)).forEach(f=>add(m,'sai',f.cat,valorFixa(f,m),1));
    cfg.cartoes.forEach(c=>{if(!isPago(m,'card_'+c.id))splitFatura(c,m,faturaValor(c,m),(row,v)=>add(m,'sai',row,v,1))});
    entradasDoMes(m).filter(e=>!isPago(m,'in_'+e.id)).forEach(e=>add(m,'ent',e.nome,valorEntrada(e,m),1));
  }
  lancsAll.forEach(l=>{if(isTerc(l)&&!l.reemb)add(l.mesRef<hm?hm:l.mesRef,'ent',ROW_REEMB,l.valor,1)});
  return M;
}
const fmtN=v=>v?(v<0?'−':'')+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'–';
function renderFluxo(){
  const el=$('#tab-fluxo');const hm=hojeMes();const M=caixa();const real=fluxoModo==='real';
  const comDados=Object.keys(M).filter(m=>m<hm).sort();
  const ini=comDados.length?(comDados[0]<addMes(hm,-5)?addMes(hm,-5):comDados[0]):hm;
  const cols=[];for(let m=ini;m<=addMes(hm,real?0:6);m=addMes(m,1))cols.push(m);
  const val=(m,g,row)=>{const c=M[m]&&M[m][g][row];if(!c)return{v:0,p:false};return real?{v:c.r,p:false}:{v:c.r+c.p,p:c.p>0.004}};
  const rowsEnt=[...new Set(cols.flatMap(m=>Object.keys((M[m]||{ent:{}}).ent)))].filter(r=>cols.some(m=>val(m,'ent',r).v)).sort((a,b)=>a===ROW_REEMB?1:b===ROW_REEMB?-1:a.localeCompare(b));
  const catOrder=[...cfg.cats.map(c=>c.id),ROW_TERC];
  const rowsSai=[...new Set(cols.flatMap(m=>Object.keys((M[m]||{sai:{}}).sai)))].filter(r=>cols.some(m=>val(m,'sai',r).v)).sort((a,b)=>{const ia=catOrder.indexOf(a),ib=catOrder.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib)});
  const nomeRow=(g,r)=>g==='ent'?(r===ROW_REEMB?'↩️ Reembolsos terceiros':'💰 '+esc(r)):(r===ROW_TERC?'👤 Terceiros (cartão)':esc(catOf(r).emoji+' '+catOf(r).nome));
  const tot=(m,g)=>{let v=0,p=false;(g==='ent'?rowsEnt:rowsSai).forEach(r=>{const x=val(m,g,r);v+=x.v;p=p||x.p});return{v:r2(v),p}};
  const cell=(x,cls='')=>`<td class="${cls}${x.p?' pv':''}">${fmtN(x.v)}</td>`;
  const curc=m=>m===hm?'cur':'';
  let t=`<table class="fx"><thead><tr><th>${real?'Realizado':'Realizado + previsto'}</th>${cols.map(m=>`<th class="${curc(m)}">${mesLabel(m)}${m===hm?'<br><small>atual</small>':m>hm?'<br><small>previsto</small>':''}</th>`).join('')}</tr></thead><tbody>`;
  t+=`<tr class="sec"><td colspan="${cols.length+1}">ENTRADAS</td></tr>`;
  rowsEnt.forEach(r=>{t+=`<tr><td>${nomeRow('ent',r)}</td>${cols.map(m=>cell(val(m,'ent',r),curc(m))).join('')}</tr>`});
  t+=`<tr class="tt"><td>Total entradas</td>${cols.map(m=>cell(tot(m,'ent'),curc(m)+' pos')).join('')}</tr>`;
  t+=`<tr class="sec"><td colspan="${cols.length+1}">SAÍDAS POR CATEGORIA</td></tr>`;
  rowsSai.forEach(r=>{t+=`<tr><td>${nomeRow('sai',r)}</td>${cols.map(m=>cell(val(m,'sai',r),curc(m))).join('')}</tr>`});
  t+=`<tr class="tt"><td>Total saídas</td>${cols.map(m=>cell(tot(m,'sai'),curc(m)+' neg')).join('')}</tr>`;
  t+=`<tr class="tt"><td>Resultado do mês</td>${cols.map(m=>{const e=tot(m,'ent'),s=tot(m,'sai'),v=r2(e.v-s.v);return cell({v,p:e.p||s.p},curc(m)+(v>=0?' pos':' neg'))}).join('')}</tr>`;
  if(!real&&cfg.saldoConta!=null){
    let acc=+cfg.saldoConta;
    t+=`<tr class="tt"><td>Saldo previsto fim do mês</td>${cols.map(m=>{if(m<hm)return`<td class="${curc(m)}"></td>`;const c=M[m]||{ent:{},sai:{}};const pend=sum(Object.values(c.ent),x=>x.p)-sum(Object.values(c.sai),x=>x.p);acc+=m===hm?pend:r2(tot(m,'ent').v-tot(m,'sai').v);return cell({v:r2(acc),p:true},curc(m)+(acc>=0?'':' neg'))}).join('')}</tr>`;
  }
  t+='</tbody></table>';
  const temSaldo=cfg.saldoConta!=null;
  let h=`<div class="card"><p class="lbl">Saldo em conta hoje</p><div class="row"><div class="grow"><div class="big">${temSaldo?brl(cfg.saldoConta):'—'}</div><div class="hint" style="margin-top:0">${temSaldo?'atualizado em '+dd(cfg.saldoData):'Informe para projetar o saldo dos próximos meses'}</div></div><button class="chip on" data-act="saldo">${temSaldo?'Atualizar':'Informar'}</button></div></div>`;
  h+=`<div class="seg" style="margin-bottom:12px"><button class="${real?'':'on'}" data-act="fmodo" data-v="tudo">Realizado + previsto</button><button class="${real?'on':''}" data-act="fmodo" data-v="real">Só realizado (caixa)</button></div>`;
  h+=`<div class="card" style="padding:0;overflow:hidden"><div class="tblw">${t}</div></div>`;
  h+=`<p class="hint">Regime de caixa: entra no mês em que foi <b>pago ou recebido</b> (data do check). Valores em <i style="color:var(--mut)">itálico cinza</i> ainda são previsão. Faturas pagas se abrem pelas categorias dos lançamentos; o que não foi lançado vai para <b>Outros</b>.</p>`;
  // entradas do mês selecionado
  const en=entradasDoMes();
  h+=`<div class="card" style="margin-top:12px"><p class="lbl">Entradas de ${mesLabel(mes,true)}</p>`;
  en.forEach(e=>{const k='in_'+e.id,p=isPago(mes,k),ck=ckOf(mes,k)||{};
    h+=`<div class="item${p?' done':''}"><button class="check${p?' on':''}" data-act="tgin" data-id="${esc(e.id)}">${p?'✓':''}</button><div class="it" data-act="ein" data-id="${esc(e.id)}"><b>${esc(e.nome)}</b><small>${e.tipo==='fixa'?'todo mês · dia '+e.dia:'só '+dd(e.data)} · ${esc(e.quem||'')}</small>${p?`<span class="tag ok">Recebido${ck.em?' '+dd(ck.em):''}</span>`:''}</div><div class="iv" data-act="rin" data-id="${esc(e.id)}">${brl(valorEntrada(e))}</div></div>`});
  if(!en.length)h+='<div class="empty">Nenhuma entrada cadastrada neste mês.</div>';
  h+=`<div class="fl tot"><span>Total</span><span>${brl(sum(en,e=>valorEntrada(e)))}</span></div><button class="btn sm" style="margin-top:10px" data-act="nin">+ Nova entrada</button><div class="hint">Toque no círculo quando o dinheiro cair (pode ajustar o valor recebido). Toque no nome para editar.</div></div>`;
  el.innerHTML=h;
  const w=el.querySelector('.tblw'),cur=el.querySelector('th.cur');if(w&&cur)w.scrollLeft=Math.max(0,cur.offsetLeft-150);
}

  <div class="card"><h3>Como usar a dois</h3><p class="hint" style="margin-top:0">Os dados ficam salvos online e aparecem igual nos dois celulares. ${backend==='firebase'?'Mande o link para o Rodrigo e adicionem à tela inicial do celular (Compartilhar → Adicionar à Tela de Início).':'Para o Rodrigo lançar também, compartilhe este app com ele como <b>Editor</b> (botão Compartilhar do Claude).'}</p></div>
  ${backend==='firebase'?`<div class="card"><h3>Conta</h3><div class="row"><div class="grow hint" style="margin-top:0">Conectado como <b>${esc(usuario)}</b></div><button class="chip" data-act="sair">Sair</button></div></div>`:''}
  <div class="card"><h3>Backup</h3><div class="btns" style="margin-top:0"><button class="btn ghost sm" data-act="backup">📋 Copiar backup</button><button class="btn ghost sm" data-act="restore">⬆️ Restaurar</button></div><p class="hint">Use para guardar uma cópia ou levar os dados de uma versão do app para outra.</p></div>`;
  el.querySelectorAll('[data-cfg]').forEach(i=>i.onchange=()=>{cfg[i.dataset.cfg]=parseBR(i.value);saveCfg();renderResumo()});
  el.querySelectorAll('[data-meta]').forEach(i=>i.onchange=()=>{const v=parseBR(i.value);const m={...cfg.metas};if(v>0)m[i.dataset.meta]=v;else delete m[i.dataset.meta];cfg.metas=m;saveCfg();renderResumo()});
}
function editarCartao(id){
  const c=id?cardOf(id):{id:'k'+uid(),nome:'',fecha:1,vence:10,antes:0};if(!c)return;
  let regra=+c.antes>0?'antes':'dia';
  sheet(`<h3>${id?'Editar':'Novo'} cartão</h3>
  <div class="fld"><label>Nome</label><input class="inp" id="kN" value="${esc(c.nome)}" placeholder="Ex.: Nubank Polyana" maxlength="30"></div>
  <div class="fld"><label>Vence todo dia</label><input class="inp" id="kV" type="number" min="1" max="31" inputmode="numeric" value="${c.vence}"></div>
  <div class="fld"><label>Fechamento</label><div class="seg" id="kR"><button data-v="dia" class="${regra==='dia'?'on':''}">Dia fixo</button><button data-v="antes" class="${regra==='antes'?'on':''}">X dias antes do venc.</button></div></div>
  <div class="fld" id="kFB" style="${regra==='dia'?'':'display:none'}"><label>Fecha todo dia</label><input class="inp" id="kF" type="number" min="1" max="31" inputmode="numeric" value="${c.fecha||''}"></div>
  <div class="fld" id="kAB" style="${regra==='antes'?'':'display:none'}"><label>Quantos dias antes do vencimento</label><input class="inp" id="kA" type="number" min="1" max="25" inputmode="numeric" value="${c.antes||''}"></div>
  <p class="hint">Compras feitas no dia do fechamento ou depois vão para a fatura seguinte.</p>
  <div class="btns">${id?'<button class="btn danger" id="kDel">Remover</button>':''}<button class="btn" id="kOk">Salvar</button></div>`,b=>{
    b.querySelectorAll('#kR button').forEach(x=>x.onclick=()=>{regra=x.dataset.v;b.querySelectorAll('#kR button').forEach(y=>y.classList.toggle('on',y===x));b.querySelector('#kFB').style.display=regra==='dia'?'':'none';b.querySelector('#kAB').style.display=regra==='antes'?'':'none'});
    b.querySelector('#kOk').onclick=()=>{
      const nome=b.querySelector('#kN').value.trim();if(!nome){toast('Dê um nome',true);return}
      const n={id:c.id,nome,vence:Math.min(31,Math.max(1,+b.querySelector('#kV').value||1)),fecha:regra==='dia'?Math.min(31,Math.max(1,+b.querySelector('#kF').value||1)):0,antes:regra==='antes'?Math.min(25,Math.max(1,+b.querySelector('#kA').value||1)):0};
      cfg.cartoes=id?cfg.cartoes.map(x=>x.id===id?n:x):[...cfg.cartoes,n];
      fecharSheet();saveCfg();renderAll();
      if(id&&(n.vence!==c.vence||n.fecha!==c.fecha||n.antes!==c.antes))toast('Regra salva — vale para novos lançamentos');
    };
    const del=b.querySelector('#kDel');if(del)del.onclick=()=>confirmar(`Remover o cartão ${c.nome}? Lançamentos antigos continuam salvos.`,'Remover',()=>{cfg.cartoes=cfg.cartoes.filter(x=>x.id!==id);saveCfg();renderAll()});
  });
}

// ================= exportar =================
function exportar(){
  const L=lancsResumo();
  const linhas=[['Tipo','Data','Mês pagto','Quem','Terceiro','Reembolsado','Categoria','Forma','Cartão','Descrição','Parcela','Valor']];
  [...L].sort((a,b)=>a.data.localeCompare(b.data)).forEach(l=>linhas.push([isTerc(l)?'Terceiro':'Dia a dia',dd(l.data)+'/'+l.data.slice(0,4),mesLabel(l.mesRef),l.quem,l.terceiro||'',isTerc(l)?(l.reemb?'Sim':'Não'):'',catOf(l.cat).nome,(FORMAS[l.forma]||'').slice(2).trim(),(cardOf(l.cartao)||{nome:''}).nome,l.desc||'',l.parcN>1?l.parc+'/'+l.parcN:'',String(l.valor).replace('.',',')]));
  aPagar().forEach(x=>{const ck=ckOf(mes,x.key)||{};linhas.push([x.tipo==='card'?'Fatura':'Fixa',ck.em?dd(ck.em)+'/'+ck.em.slice(0,4):'dia '+x.dia,mesLabel(mes),x.f?x.f.quem||'':'','','',x.f?catOf(x.f.cat).nome:'Cartão','',x.c?x.c.nome:'',x.nome+(isPago(mes,x.key)?' (pago)':' (pendente)'),'',String(x.valor).replace('.',',')])});
  const txt=linhas.map(r=>r.map(c=>String(c).replace(/[\t\n]/g,' ')).join('\t')).join('\n');
  const mostrar=()=>sheet(`<h3>Copie o texto abaixo</h3><textarea class="inp" readonly>${esc(txt)}</textarea><div class="btns"><button class="btn" data-act="fechar">Fechar</button></div>`,b=>{const t=b.querySelector('textarea');t.focus();t.select()});
  try{navigator.clipboard.writeText(txt).then(()=>toast('✓ Copiado — cole no Excel/Sheets'),mostrar)}catch(e){mostrar()}
}

// ================= eventos =================
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){goTab(t.dataset.tab);return}
  const a=t.dataset.act,v=t.dataset.v,id=t.dataset.id,k=t.dataset.k;
  switch(a){
    case'fechar':fecharSheet();break;
    case'mes':mes=addMes(mes,+t.dataset.n);$('#mesLbl').textContent=mesLabel(mes);garanteLimite();renderDados();break;
    case'fq':form.quem=v;t.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===t));$('#tercBox').style.display=v===TERC?'':'none';if(v===TERC)$('#fTerc').focus();break;
    case'fc':form.cat=v;t.parentNode.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x===t));break;
    case'ff':form.forma=v;if(v!=='cartao')form.parc=1;t.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===t));$('#cardBox').style.display=v==='cartao'?'':'none';$('#parcN').textContent=form.parc+'x';atualizaInfo();break;
    case'fk':form.cartao=v;t.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===t));atualizaInfo();break;
    case'parc':form.parc=Math.min(24,Math.max(1,form.parc+ +t.dataset.n));$('#parcN').textContent=form.parc+'x';atualizaInfo();break;
    case'fd':form.data=v==='ontem'?ontem():hoje();renderLancar();break;
    case'el':abrirLanc(id);break;
    case'modo':resumoModo=v;store.set('modo',v);renderResumo();break;
    case'filtro':filtroQuem=v;renderResumo();break;
    case'exportar':exportar();break;
    case'tg':toggleItem(k);break;
    case'pay':abrirPagamento(k);break;
    case'efx':editarFixa(id);break;
    case'nfx':editarFixa(null);break;
    case'modelo':addModelo();break;
    case'saldo':editarSaldo();break;
    case'fmodo':fluxoModo=v;store.set('fluxo',v);renderFluxo();break;
    case'nin':editarEntrada(null);break;
    case'ein':editarEntrada(id);break;
    case'tgin':toggleEntrada(id);break;
    case'rin':receberEntrada(id);break;
    case'seed':aplicarSeed();break;
    case'sair':sair();break;
    case'backup':backup();break;
    case'restore':restaurar();break;
    case'ecard':editarCartao(id);break;
    case'ncard':editarCartao(null);break;
    case'rmcat':{const c=catOf(id);confirmar(`Remover a categoria “${c.nome}”? Lançamentos antigos continuam, aparecendo como “Outros”.`,'Remover',()=>{cfg.cats=cfg.cats.filter(x=>x.id!==id);const m={...cfg.metas};delete m[id];cfg.metas=m;if(form.cat===id)form.cat=null;saveCfg();renderAll()});break}
    case'addcat':{const n=$('#nCat').value.trim();if(!n){toast('Digite o nome',true);return}cfg.cats=[...cfg.cats,{id:'c'+uid(),emoji:$('#nEmo').value.trim()||'🔖',nome:n}];saveCfg();renderAll();break}
    case'rmp':confirmar(`Remover ${v} da lista? Lançamentos antigos continuam no histórico.`,'Remover',()=>{cfg.pessoas=cfg.pessoas.filter(p=>p!==v);saveCfg();renderAll()});break;
    case'addp':{const n=$('#nPes').value.trim();if(!n||n===TERC||cfg.pessoas.includes(n))return;cfg.pessoas=[...cfg.pessoas,n];saveCfg();renderAll();break}
  }
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.includes(h)&&h!==tab)goTab(h)});
const TABS=['lancar','resumo','pagar','fluxo','ajustes'];

// ================= dados =================
function dbErr(e){if(e&&e.code==='revoked'){setStatus('Acesso aos dados encerrado nesta tela.','bad');return}const c=e&&e.code||'';setStatus(/permission/.test(c)?'Sem permissão para ver os dados ('+(usuario||'sem login')+'). Confira o e-mail nas regras do Firebase.':'Problema ao carregar os dados'+(c?' ('+c+')':'')+'. Feche e abra o app de novo.','bad')}
function subLanc(){
  if(!db)return;unL&&unL();
  unL=db.collection('lanc').where('mesRef','>=',boundL).onSnapshot(s=>{lancsAll=s.docs.map(d=>({id:d.id,...d.data()}));renderDados()},dbErr);
}
function garanteLimite(){const need=addMes(mes,-1);if(boundL&&need<boundL){boundL=addMes(need,-6);subLanc()}}
function loadScript(src){return new Promise((ok,err)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=err;document.head.appendChild(s)})}
async function conectar(){
  try{if(window.claude&&window.claude.use){const d=await window.claude.use('db');if(d){backend='claude';return d}}}catch(e){}
  if(!FIREBASE_CONFIG)return null;
  try{
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
    // app separado ("casa"): sessão de login própria, sem misturar com o login anônimo dos outros painéis
    const app=firebase.apps.find(a=>a.name==='casa')||firebase.initializeApp(FIREBASE_CONFIG,'casa');
    const auth=app.auth();appCasa=app;
    let user=await new Promise(r=>{const u=auth.onAuthStateChanged(x=>{u();r(x)})});
    if(!user||user.isAnonymous||!user.email){if(user)try{await auth.signOut()}catch(e){}user=await pedirLogin(auth)}
    usuario=user.email||'';
    const fs=app.firestore();try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    const P='casa_';backend='firebase';
    return{doc:p=>fs.doc(P+p),collection:p=>fs.collection(P+p)};
  }catch(e){return null}
}
let usuario='',appCasa=null;
function pedirLogin(auth){
  return new Promise(ok=>{
    const L=$('#login'),err=$('#lgErr'),btn=$('#lgBtn');L.classList.add('on');
    $('#lgForm').onsubmit=async ev=>{ev.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Entrando…';
      try{const c=await auth.signInWithEmailAndPassword($('#lgE').value.trim(),$('#lgS').value);L.classList.remove('on');ok(c.user)}
      catch(e){const c=e&&e.code||'';err.textContent=/invalid|wrong|not-found|credential/.test(c)?'E-mail ou senha incorretos.':c.includes('too-many')?'Muitas tentativas. Aguarde alguns minutos.':c.includes('network')?'Sem internet.':'Não foi possível entrar ('+c+').'}
      btn.disabled=false;btn.textContent='Entrar'};
    $('#lgEsq').onclick=async()=>{const em=$('#lgE').value.trim();if(!em){err.textContent='Digite seu e-mail acima.';return}
      try{await auth.sendPasswordResetEmail(em);err.textContent='Enviamos um link para redefinir a senha no seu e-mail.'}catch(e){err.textContent='Não consegui enviar. Confira o e-mail.'}};
  });
}
async function sair(){try{await appCasa.auth().signOut()}catch(e){}location.reload()}
async function aplicarSeed(){
  if(!db||!SEED)return;
  confirmar('Carregar contas fixas, receitas e pagamentos de novembro?','Carregar',async()=>{
    try{for(const [path,data] of Object.entries(SEED))await db.doc(path).set(data);toast('✓ Dados de novembro carregados')}catch(e){toast(errMsg(e),true)}
  });
}
function backup(){
  const dump={versao:1,gerado:new Date().toISOString(),'config/geral':cfg};
  lancsAll.forEach(l=>{const {id,...d}=l;dump['lanc/'+id]=d});fixas.forEach(f=>{const {id,...d}=f;dump['fixas/'+id]=d});
  entradas.forEach(x=>{const {id,...d}=x;dump['entradas/'+id]=d});Object.entries(checksAll).forEach(([m,d])=>dump['checks/'+m]=d);
  const txt=JSON.stringify(dump);
  const mostrar=()=>sheet(`<h3>Backup (copie e guarde)</h3><textarea class="inp" readonly>${esc(txt)}</textarea><div class="btns"><button class="btn" data-act="fechar">Fechar</button></div>`,b=>{const t=b.querySelector('textarea');t.focus();t.select()});
  try{navigator.clipboard.writeText(txt).then(()=>toast('✓ Backup copiado'),mostrar)}catch(e){mostrar()}
}
function restaurar(){
  sheet(`<h3>Restaurar backup</h3><p class="hint">Cole o texto do backup. Os registros com o mesmo código serão sobrescritos.</p><textarea class="inp" id="bkT"></textarea><div class="btns"><button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn" id="bkOk">Restaurar</button></div>`,b=>{
    b.querySelector('#bkOk').onclick=async()=>{
      let d;try{d=JSON.parse(b.querySelector('#bkT').value)}catch(e){toast('Texto inválido',true);return}
      fecharSheet();let n=0;
      try{for(const [path,data] of Object.entries(d)){if(!/^(config|lanc|fixas|entradas|checks)\/[\w\-.:~@+]+$/.test(path)||!data||typeof data!=='object')continue;await db.doc(path).set(data);n++}toast(`✓ ${n} registros restaurados`)}catch(e){toast(errMsg(e),true)}
    };
  });
}
async function init(){
  const h=location.hash.slice(1);
  renderAll();goTab(TABS.includes(h)?h:'lancar');
  const timer=setTimeout(()=>setStatus('Ainda conectando aos dados… verifique a internet.','warn'),10000);
  db=await conectar();
  if(!db){clearTimeout(timer);setStatus(FIREBASE_CONFIG?'Não consegui conectar ao banco de dados. Verifique a internet.':'Abra este app pelo link do Claude, logado na sua conta, para salvar e sincronizar.','bad');return}
  db.doc('config/geral').onSnapshot(s=>{
    if(!s.metadata.fromCache){clearTimeout(timer);setStatus('')}
    cfg=s.exists?mergeCfg(s.data()):JSON.parse(JSON.stringify(DEF_CFG));
    const ae=document.activeElement;
    if(ae&&$('#tab-ajustes').contains(ae))ajustesSujo=true;else renderAjustes();
    if(!(ae&&$('#tab-lancar').contains(ae)&&ae.tagName==='INPUT'))renderLancar();
    renderDados();
  },e=>{clearTimeout(timer);dbErr(e)});
  db.collection('fixas').onSnapshot(s=>{fixas=s.docs.map(d=>({id:d.id,...d.data()}));renderDados()},dbErr);
  db.collection('entradas').onSnapshot(s=>{entradas=s.docs.map(d=>({id:d.id,...d.data()}));renderDados()},dbErr);
  db.collection('checks').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());checksAll=o;renderDados()},dbErr);
  boundL=addMes(hojeMes(),-12);subLanc();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(ajustesSujo&&!$('#tab-ajustes').contains(document.activeElement))renderAjustes()},50));
init();
</script>
